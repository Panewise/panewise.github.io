<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gridpull demo — paginated report</title>
<style>
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 32px; background: #f6f7f6; color: #15211f; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #566761; margin: 0 0 24px; }
  table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e3e8e5; }
  th { background: #0d5c54; color: #fff; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pager { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .pager button { font: inherit; padding: 6px 14px; border: 1px solid #c9d2cd; background: #fff; border-radius: 3px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager span { color: #566761; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Invoice report — Q3</h1>
  <p class="sub">237 rows across 5 pages &mdash; a report in the shape that makes people copy by hand five times.<br>Use this page to try <strong>Gridpull</strong>: scan, tick &ldquo;Walk through every page and merge&rdquo;, export. You should get all 237 rows in one file.</p>

  <table id="grid">
    <caption style="caption-side: top; text-align: left; padding-bottom: 8px; font-weight: 600;">Invoices</caption>
    <thead>
      <tr><th>Invoice</th><th>Client</th><th>Issued</th><th>Status</th><th>Amount (EUR)</th></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>

  <div class="pager">
    <button id="prev" aria-label="Previous page">‹ Previous</button>
    <span id="label"></span>
    <button id="next" aria-label="Next page">Next ›</button>
  </div>
</div>

<script>
  const CLIENTS = ['Northwind Ltd', 'Contoso doo', 'Adventure Works', 'Fabrikam SA', 'Litware GmbH', 'Proseware BV', 'Tailspin Oy'];
  const STATUS = ['Paid', 'Pending', 'Overdue', 'Draft'];
  const TOTAL = 237;
  const PER_PAGE = 50;

  // Deterministic data, so a re-run produces the same rows.
  const rows = Array.from({ length: TOTAL }, (_, i) => {
    const n = i + 1;
    const day = (n * 7) % 28 + 1;
    const month = (n % 3) + 7;
    return {
      invoice: 'INV-2026-' + String(1000 + n),
      client: CLIENTS[n % CLIENTS.length],
      issued: `2026-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`,
      status: STATUS[n % STATUS.length],
      amount: ((n * 137) % 9000 + 250).toFixed(2)
    };
  });

  let page = 0;
  const pages = Math.ceil(TOTAL / PER_PAGE);

  function render() {
    const slice = rows.slice(page * PER_PAGE, (page + 1) * PER_PAGE);
    document.getElementById('body').innerHTML = slice.map((r) =>
      `<tr><td>${r.invoice}</td><td>${r.client}</td><td>${r.issued}</td><td>${r.status}</td><td class="num">${r.amount}</td></tr>`
    ).join('');
    document.getElementById('label').textContent = `Page ${page + 1} of ${pages}`;
    document.getElementById('prev').disabled = page === 0;
    document.getElementById('next').disabled = page === pages - 1;
  }

  document.getElementById('next').addEventListener('click', () => { if (page < pages - 1) { page += 1; render(); } });
  document.getElementById('prev').addEventListener('click', () => { if (page > 0) { page -= 1; render(); } });
  render();
</script>
</body>
</html>
